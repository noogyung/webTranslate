<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>이미지 번역 진단</title>
<link rel="stylesheet" href="image.css"></head><body>
<h1>이미지 번역 진단</h1>
<p>원본 이미지를 선택하세요. 현재 확장 설정의 OCR·합성 모델을 사용합니다. 일반 번역과 같은 긴 축 1024px 입력으로 검사합니다.</p>
<div class="controls">
<label>원본 이미지 <input id="source" type="file" accept="image/*"></label>
<button id="prepare">1. OCR + 왕복 검사</button>
<label><input id="reviewed" type="checkbox"> 크롭·왕복 결과를 확인했습니다</label>
<button id="generate" disabled>2. 저장된 입력으로 AI 합성 (API 비용 발생)</button>
<button id="replay" disabled>3. 반환본 다시 분할 (API 호출 없음)</button>
<button id="export" disabled>진단 묶음 저장</button>
<label>진단 묶음 열기 <input id="import" type="file" accept="application/json,.json"></label>
<button id="clear">자료 지우기</button>
</div>
<p>검사 자료는 이 탭의 메모리에만 보관됩니다. 필요한 경우 저장하세요. 저장 파일에는 이미지와 인식된 문장이 포함됩니다.</p>
<p id="status" role="status" aria-live="polite">대기 중 — 첫 단계는 OCR API만 호출하며 이미지 생성은 실행하지 않습니다.</p>
<pre id="metadata"></pre><ul id="warnings"></ul><main id="results"></main>
<script type="module" src="image.js"></script></body></html>
